name: Publish Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag version $tag_version does not match package version $package_version."
            exit 1
          fi

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Package Extension
        run: npx --no-install vsce package

      - name: Show VSIX File
        run: ls -la *.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx --no-install vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx --no-install ovsx publish *.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
